<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Clip Maker 編集画面</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { background: #f3f3f1; }
  main { max-width: 1500px; margin: 0 auto; padding: 16px 20px 40px; }
  h1 { font-size: 22px; margin: 0; }
  h1 span { font-size: 14px; color: var(--sub); font-weight: 400; }
  #clipinfo { font-size: 16px; color: var(--sub); margin: 2px 0 14px; }
  h2 { font-size: 19px; margin: 0 0 10px; }
  section { background: #fff; border: 1px solid #d8d8d8; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .cols { display: grid; grid-template-columns: 500px 1fr; gap: 14px; align-items: start; }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 1000px) { .cols, .cols2 { grid-template-columns: 1fr; } }

  #recap { margin-top: 12px; width: 100%; }

  .opt { display: grid; grid-template-columns: 120px 1fr 64px; gap: 8px 10px; align-items: center; margin-top: 8px; }
  .opt input[type=range] { width: 100%; }
  .opt .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--sub); }
  .choice { display: flex; gap: 8px; flex-wrap: wrap; }
  .choice label { border: 1px solid #999; border-radius: 6px; padding: 6px 14px; cursor: pointer; background: #fff; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 17px; }
  .check input { width: 20px; height: 20px; }
  .hidden { display: none !important; }

  /* プレビュー */
  #stagewrap { display: flex; justify-content: center; align-items: center; gap: 12px; background: #222; border-radius: 6px; padding: 8px; }
  /* 縦のときだけ出す「元の動画」。動画のまわりに余白を見せて、囲み枠を動画の外まで広げられるようにする */
  #srcwrap { flex: 1 1 0; min-width: 0; }
  .srccap { color: #fff; font-size: 15px; margin-bottom: 6px; }
  .srccap.sub { color: #bbb; font-size: 14px; margin: 6px 0 0; }
  #srcstage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; touch-action: none; user-select: none; cursor: crosshair;
              background-image: repeating-linear-gradient(45deg, #1b1b1b 0 10px, #111 10px 20px); }
  #srcimg { position: absolute; left: 20%; top: 20%; width: 60%; height: 60%; pointer-events: none; }
  #cropbox { position: absolute; border: 3px solid #ffd400; box-sizing: border-box; cursor: move; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); }
  #cropbox .h { position: absolute; width: 18px; height: 18px; background: #ffd400; border: 2px solid #000; border-radius: 3px; }
  #cropbox .h.nw { left: -10px; top: -10px; cursor: nwse-resize; }
  #cropbox .h.ne { right: -10px; top: -10px; cursor: nesw-resize; }
  #cropbox .h.sw { left: -10px; bottom: -10px; cursor: nesw-resize; }
  #cropbox .h.se { right: -10px; bottom: -10px; cursor: nwse-resize; }
  #stage { position: relative; overflow: hidden; background: #000; touch-action: none; user-select: none; }
  #stage.landscape { width: 100%; aspect-ratio: 16 / 9; }
  #stage.portrait { height: min(70vh, 720px); aspect-ratio: 9 / 16; flex: 0 0 auto; }
  #pv { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ov { position: absolute; inset: 0; cursor: crosshair; }
  .mask { position: absolute; border: 2px solid #ff4d4d; box-sizing: border-box; cursor: move; }
  .mask.sel { border-color: #ffd400; box-shadow: 0 0 0 1px #000; }
  .mask .h { position: absolute; width: 16px; height: 16px; background: #ffd400; border: 2px solid #000; border-radius: 3px; display: none; }
  .mask.sel .h { display: block; }
  .mask .h.nw { left: -9px; top: -9px; cursor: nwse-resize; }
  .mask .h.ne { right: -9px; top: -9px; cursor: nesw-resize; }
  .mask .h.sw { left: -9px; bottom: -9px; cursor: nesw-resize; }
  .mask .h.se { right: -9px; bottom: -9px; cursor: nwse-resize; }
  .mask .x { position: absolute; left: 50%; top: 50%; margin: -15px 0 0 -15px; width: 30px; height: 30px; border-radius: 15px; background: #b00020; color: #fff;
             font-weight: 700; font-size: 17px; line-height: 26px; text-align: center; border: 2px solid #fff; cursor: pointer; display: none; padding: 0; }
  .mask.sel .x { display: block; }
  .mask.tmp { border-style: dashed; pointer-events: none; }
  #stagemsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; padding: 16px; text-align: center; pointer-events: none; }
  #timebar { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  #play { width: 56px; font-size: 20px; padding: 6px 0; }
  #pvtime { flex: 1; height: 28px; }
  #pvtimedisp { font-variant-numeric: tabular-nums; min-width: 150px; text-align: right; font-size: 17px; }
  .hint { color: var(--sub); font-size: 15px; margin-top: 8px; }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 4px 4px; text-align: left; vertical-align: middle; font-weight: normal; }
  th { color: var(--sub); font-size: 14px; }
  table input[type=number] { width: 86px; font-size: 16px; }
  table input[type=text] { width: 100%; font-size: 17px; }
  .del { color: var(--bad); }
  .playcue { padding: 4px 10px; }
  .amt { color: #a87400; font-weight: 700; }
  #chatwrap { max-height: 420px; overflow-y: auto; }
  #chat td { font-size: 16px; border-bottom: 1px dotted #ddd; }
  #chat td:first-child { width: 70px; color: var(--sub); font-variant-numeric: tabular-nums; }
  #masklist td { font-size: 15px; }
  #masklist input { width: 76px; }
  #masklist { margin-top: 10px; width: auto; }
  #masklist td, #masklist th { padding-right: 18px; }

  #save { width: 100%; font-size: 21px; padding: 16px; }
</style></head><body>
<main>
  <h1>Clip Maker 編集画面 <span id="edver"></span></h1>
  <div id="clipinfo"></div>

  <div class="cols">
    <div>
      <section>
        <h2>① 切り抜く時間</h2>
        <div class="range">
          <div class="times">
            <div class="tcol"><div class="cap">開始</div><div id="start_sec"></div></div>
            <div class="tilde">〜</div>
            <div class="tcol"><div class="cap">終了</div><div id="end_sec"></div></div>
          </div>
          <div class="under">
            <button id="nowstart">今時間取得</button>
            <div class="lenbox">長さ <input id="len_sec" type="number" min="0.1" max="60" step="0.1"> 秒</div>
            <button id="nowend">今時間取得</button>
          </div>
        </div>
        <button id="recap">この時間で取り直す</button>
        <div id="capmsg" class="msg"></div>
      </section>

      <section>
        <h2>画面の形</h2>
        <div class="choice">
          <label><input type="radio" name="mode" value="landscape"> 横</label>
          <label><input type="radio" name="mode" value="portrait"> 縦（ショート）</label>
        </div>
        <div id="portraitopts">
          <div class="opt"><span>上下の位置</span>
            <div class="choice">
              <label><input type="radio" name="valign" value="top"> 上より</label>
              <label><input type="radio" name="valign" value="center"> 中央</label>
              <label><input type="radio" name="valign" value="bottom"> 下より</label>
            </div><span></span></div>
        </div>
      </section>

      <section>
        <h2>音声</h2>
        <div class="choice">
          <label><input type="radio" name="audio" value="on"> 音あり</label>
          <label><input type="radio" name="audio" value="off"> 音なし</label>
        </div>
      </section>

      <section>
        <h2>字幕</h2>
        <div class="opt"><span>高さ</span><input id="cap_bottom" type="range" min="1" max="95" step="1"><span class="val" id="cap_bottomv"></span></div>
        <div class="opt"><span>文字の大きさ</span><input id="cap_font" type="range" min="3" max="12" step="0.1"><span class="val" id="cap_fontv"></span></div>
      </section>

      <section>
        <h2>コメント</h2>
        <label class="check"><input type="checkbox" id="chat_on"> コメントを右から左に流す</label>
        <div id="chatopts">
          <div class="opt"><span>濃さ</span><input id="chat_opacity" type="range" min="0.2" max="1" step="0.05"><span class="val" id="chat_opacityv"></span></div>
          <div class="opt"><span>文字の大きさ</span><input id="chat_font" type="range" min="2" max="9" step="0.1"><span class="val" id="chat_fontv"></span></div>
          <div class="opt"><span>高さ</span><input id="chat_top" type="range" min="0" max="90" step="1"><span class="val" id="chat_topv"></span></div>
          <div class="opt"><span>行の数</span><input id="chat_lanes" type="range" min="1" max="10" step="1"><span class="val" id="chat_lanesv"></span></div>
          <div class="opt"><span>流れる時間</span><input id="chat_cross" type="range" min="3" max="12" step="0.5"><span class="val" id="chat_crossv"></span></div>
        </div>
      </section>
    </div>

    <div>
      <section>
        <h2>② 出来上がり</h2>
        <div id="stagewrap">
          <div id="srcwrap" class="hidden">
            <div class="srccap">元の動画 — 黄色い枠で使う所を囲む</div>
            <div id="srcstage"><img id="srcimg" alt=""><div id="cropbox"><div class="h nw" data-h="nw"></div><div class="h ne" data-h="ne"></div><div class="h sw" data-h="sw"></div><div class="h se" data-h="se"></div></div></div>
            <div class="srccap sub">枠は掴んで移動・角で大きさ変更。動画の外まで広げた所と、枠の上下は黒になります。</div>
          </div>
          <div id="stage" class="landscape"><canvas id="pv"></canvas><div id="ov"></div><div id="stagemsg"></div></div>
        </div>
        <div id="timebar"><button id="play" title="再生／停止（スペースキー）">▶</button><input id="pvtime" type="range" min="0" max="15" step="0.1" value="0"><span id="pvtimedisp"></span></div>
        <div id="pvmsg" class="msg" style="min-height:0"></div>
        <div class="hint">隠したい所は画面の上をドラッグ。四角はいくつでも作れます。作った四角は、掴んで移動・角を掴んで大きさ変更・× で削除。</div>
        <table id="masklist" class="hidden"><thead><tr><th>隠す四角</th><th>出す時間（秒）</th><th>消す時間（空＝最後まで）</th><th></th></tr></thead><tbody></tbody></table>
      </section>
    </div>
  </div>

  <div class="cols2">
    <section>
      <h2>③ 字幕の文</h2>
      <div class="msg bad" id="cuesmsg"></div>
      <table id="cues"><thead><tr><th></th><th>開始（秒）</th><th>終了（秒）</th><th>文</th><th></th></tr></thead><tbody></tbody></table>
      <button id="addcue" style="margin-top:8px">字幕を追加</button>
    </section>
    <section>
      <h2>コメント一覧</h2>
      <div class="msg bad" id="chatmsg"></div>
      <div id="chatwrap"><table id="chat"><tbody></tbody></table></div>
    </section>
  </div>

  <button id="save" class="primary">動画を作る（動画タブに移動します）</button>
  <div id="msg" class="msg"></div>
</main>
<script src="common.js"></script>
<script src="editor.js"></script>
</body></html>
