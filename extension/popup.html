<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 12px; color: #222; }
  label { display: block; margin: 6px 0 2px; }
  input { width: 100%; box-sizing: border-box; padding: 4px; }
  button { width: 100%; margin-top: 10px; padding: 8px; font-weight: 600; }
  #savedirect { font-weight: 400; padding: 5px; margin-top: 6px; }
  #msg { margin-top: 8px; white-space: pre-wrap; color: #b00; }
  #ok { color: #080; }
</style></head><body>
<b>Clip Maker 無料版</b> <span id="ver" style="color:#888"></span>
<label>開始（1:24:09 形式 または 秒・空欄＝今の再生位置）</label>
<div style="display:flex; gap:6px">
  <input id="start" type="text" inputmode="numeric" placeholder="例: 1:24:09 または 5049" style="flex:1">
  <button id="nowbtn" style="width:auto; margin:0; padding:4px 8px; font-weight:400" title="動画の今の再生位置を開始時間に入れる">▶ 今の位置</button>
</div>
<div style="display:flex; gap:6px">
  <div style="flex:1"><label>長さ（秒・最大 30）</label>
    <input id="length" type="number" min="1" max="30" step="1" placeholder="15"></div>
  <div style="flex:1.4"><label>終了（空欄＝開始+長さ）</label>
    <input id="end" type="text" inputmode="numeric" placeholder="例: 1:24:25"></div>
</div>
<button id="go">吸い出して編集画面を開く</button>
<button id="savedirect">編集せずそのまま保存（3 ファイル）</button>
<div id="msg"></div>
<script src="common.js"></script>
<script src="popup.js"></script>
</body></html>
