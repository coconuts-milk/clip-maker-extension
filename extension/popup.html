<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; color: #222; }
  label { display: block; margin: 6px 0 2px; }
  input { width: 100%; box-sizing: border-box; padding: 4px; font-size: 14px; }
  .row { display: flex; gap: 6px; align-items: flex-end; }
  .row > div { flex: 1; }
  .now { width: auto; margin: 0; padding: 4px 8px; font-weight: 400; white-space: nowrap; }
  button { width: 100%; margin-top: 10px; padding: 8px; font-weight: 600; }
  #rangeview { margin-top: 6px; font-size: 12px; color: #444; font-variant-numeric: tabular-nums; }
  #rangeview.bad { color: #b00; }
  #msg { margin-top: 8px; white-space: pre-wrap; color: #b00; }
  #ok { color: #080; }
  .note { color: #777; font-size: 11px; }
</style></head><body>
<b>Clip Maker 無料版</b> <span id="ver" style="color:#888"></span>
<div class="row">
  <div><label>開始（1:24:09 か 秒）</label><input id="start" type="text" inputmode="numeric" placeholder="例: 1:24:09"></div>
  <button id="nowstart" class="now" title="YouTube の今の再生位置（停止中ならその時刻）を開始に入れる">▶ 今の位置</button>
</div>
<div class="row">
  <div><label>終了</label><input id="end" type="text" inputmode="numeric" placeholder="例: 1:24:25"></div>
  <button id="nowend" class="now" title="YouTube の今の再生位置を終了に入れる">▶ 今の位置</button>
</div>
<label>長さ（秒・最大 60）</label>
<input id="length" type="number" min="1" max="60" step="0.1" value="15">
<div class="note">開始・終了・長さのどれを変えても残りが自動で追随します。</div>
<div id="rangeview"></div>
<button id="go">吸い出して編集画面を開く</button>
<div id="msg"></div>
<script src="common.js"></script>
<script src="popup.js"></script>
</body></html>
