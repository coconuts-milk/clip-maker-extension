<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Clip Maker</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { padding: 14px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h1 span { font-size: 13px; color: var(--sub); font-weight: 400; }
  /* サイドパネルは幅 360px 前後。開始と終了を横に並べて収まる大きさにする */
  body { padding: 14px 12px; }
  .timeinput .tbox { width: 32px; font-size: 19px; padding: 6px 0; }
  .timeinput .tbox.td { width: 22px; }
  .timeinput .tsep { font-size: 19px; }
  .range .under button { padding: 8px 8px; font-size: 15px; }
  .range .lenbox { gap: 4px; }
  .range .lenbox input { width: 64px; font-size: 19px; padding: 6px 2px; }
  #go { width: 100%; margin-top: 14px; }
  .subsrc { margin-top: 16px; }
  .subsrc .cap { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .choice { display: flex; gap: 8px; flex-wrap: wrap; }
  .choice label { border: 1px solid #999; border-radius: 6px; padding: 6px 12px; cursor: pointer; background: #fff; font-size: 16px; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .note { color: var(--sub); font-size: 14px; margin-top: 6px; min-height: 1.4em; }
  .hidden { display: none !important; }
  .filebtn { display: block; text-align: center; font-size: 15px; padding: 8px 12px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
  .bar { height: 8px; background: #e3e3e3; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  #modelfill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
</style></head><body>
<h1>Clip Maker <span id="ver"></span></h1>
<div class="range">
  <div class="times">
    <div class="tcol"><div class="cap">開始</div><div id="start"></div></div>
    <div class="tilde">〜</div>
    <div class="tcol"><div class="cap">終了</div><div id="end"></div></div>
  </div>
  <div class="under">
    <button id="nowstart">今時間取得</button>
    <div class="lenbox">長さ <input id="length" type="number" min="0.1" max="60" step="0.1"> 秒</div>
    <button id="nowend">今時間取得</button>
  </div>
</div>
<div class="subsrc">
  <div class="cap">字幕</div>
  <div class="choice">
    <label><input type="radio" name="subsrc" value="youtube"> YouTube の字幕</label>
    <label><input type="radio" name="subsrc" value="asr"> 音声認識</label>
  </div>
  <div id="asropts" class="hidden">
    <div class="choice" style="margin-top:8px">
      <label><input type="radio" name="asrmodel" value="small"> 標準</label>
      <label><input type="radio" name="asrmodel" value="turbo"> 高精度</label>
    </div>
    <div class="note" id="modelstat"></div>
    <div class="bar"><div id="modelfill"></div></div>
  </div>
  <div class="note" id="subnote"></div>
</div>
<button id="go" class="primary">吸い出して編集画面を開く</button>
<div id="msg" class="msg"></div>
<div class="subsrc">
  <div class="cap">保存した設定</div>
  <label class="filebtn">設定ファイルから開く<input type="file" id="loadproj" accept=".json,application/json" hidden></label>
  <div class="note" id="projmsg"></div>
</div>
<script src="common.js"></script>
<script src="asr.js"></script>
<script src="panel.js"></script>
</body></html>
