[project]
name = "clipmaker"
version = "0.2.0"
description = "YouTube 切り抜き PC プロ版（clip.json + srt + chat.json → 字幕・チャット焼き込み mp4。横／縦 Shorts）"
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2024.1.1"]

[project.scripts]
clipmaker = "clipmaker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
