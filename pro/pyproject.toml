[project]
name = "clipmaker"
version = "0.1.0"
description = "YouTube 切り抜き PC プロ版（clip.json + srt → 字幕焼き込み mp4）"
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2024.1.1"]

[project.scripts]
clipmaker = "clipmaker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
